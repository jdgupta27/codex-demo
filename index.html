<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmation Form</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f4f6fb; }
    .card { width: min(92vw, 460px); background: #fff; border-radius: 14px; box-shadow: 0 12px 30px rgba(31,42,68,.12); padding: 1.5rem; }
    form { display: grid; gap: .9rem; }
    input, textarea, button { font: inherit; padding: .65rem .7rem; border-radius: 8px; }
    input, textarea { border: 1px solid #cfd6e6; }
    textarea { min-height: 90px; resize: vertical; }
    button { border: 0; background: #2f67ff; color: #fff; font-weight: 700; cursor: pointer; }
    #confirmation { display: none; margin-top: 1rem; padding: .9rem; border-radius: 8px; background: #eef5ff; border: 1px solid #cde0ff; color: #19439a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Contact Form</h1>
    <p>Submit the form to get a confirmation email.</p>

    <form id="contact-form">
      <input type="text" name="name" placeholder="Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" placeholder="Message" required></textarea>
      <button type="submit">Submit</button>
    </form>

    <section id="confirmation" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const confirmation = document.getElementById('confirmation');

    // Replace this with your real receiving mailbox.
    const receiverEmail = 'your-email@example.com';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      data.append('_replyto', data.get('email'));
      data.append('_autoresponse', 'Thanks for your submission. This is your confirmation email.');
      data.append('_template', 'table');

      try {
        const response = await fetch(`https://formsubmit.co/ajax/${receiverEmail}`, {
          method: 'POST',
          body: data,
          headers: { Accept: 'application/json' }
        });

        const result = await response.json();

        if (result.success === 'true') {
          confirmation.textContent = `Submitted. A confirmation email has been sent to ${data.get('email')}.`;
          form.reset();
        } else {
          confirmation.textContent = 'Submission failed. Please verify your receiver email setup and try again.';
        }
      } catch (error) {
        confirmation.textContent = 'Network error while sending form. Please try again.';
      }

      confirmation.style.display = 'block';
    });
  </script>
</body>
</html>
